plugins {
    id 'com.gradleup.shadow'
}


import net.fabricmc.loom.task.RemapJarTask

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        server.setGenerateRunConfig(false)
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    neoForge {
        convertAccessWideners(tasks.named('remapJar', RemapJarTask.class), 'colorfulhearts_extensions.accesswidener')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    remapArtifact {
        canBeConsumed = true
        canBeResolved = false
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    common(project(path: ':extensions:common', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':extensions:common', configuration: 'transformProductionNeoForge'))

    api(project(path: ':api:common', configuration: 'namedElements')) { transitive false }
    api(project(path: ':api:neoforge', configuration: 'namedElements')) { transitive false }
    runtimeOnly(project(path: ':base:common', configuration: 'namedElements')) { transitive false }
    runtimeOnly(project(path: ':base:neoforge', configuration: 'namedElements')) { transitive false }

    modCompileOnly("maven.modrinth:farmers-delight:${farmersdelight_version}-neoforge")
//    modRuntimeOnly("maven.modrinth:the-undergarden:${undergarden_version}-neoforge")
    modRuntimeOnly("maven.modrinth:raised:${raised_version}-neoforge")

    modImplementation("maven.modrinth:appleskin:${appleskin_version}-neoforge")
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${clothconfig_version}")

    modRuntimeOnly("maven.modrinth:forge-config-api-port:${forgeconfig_version}-neoforge")
    modImplementation("maven.modrinth:overflowing-bars:${overflowingbars_version}-neoforge")
    modImplementation("maven.modrinth:puzzles-lib:${puzzleslib_version}-neoforge")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

remapJar {
    input.set shadowJar.archiveFile
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

artifacts {
    remapArtifact(remapJar)
}
