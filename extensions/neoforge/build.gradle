plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        server.setGenerateRunConfig(false)
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    neoForge {
        convertAccessWideners(tasks.named('shadowJar', Jar.class), 'colorfulhearts_extensions.accesswidener')
    }

    loom.nestJars(tasks.named("shadowJar", Jar.class), configurations.named("include"))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = true
    }

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }

    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    common(project(path: ':extensions:common')) { transitive false }
    shadowCommon(project(path: ':extensions:common', configuration: 'transformProductionNeoForge'))

    api(project(path: ':api:common')) { transitive false }
    api(project(path: ':api:neoforge')) { transitive false }
    runtimeOnly(project(path: ':base:common')) { transitive false }
    runtimeOnly(project(path: ':base:neoforge')) { transitive false }

//    compileOnly("maven.modrinth:farmers-delight:${farmersdelight_version}-neoforge")
//    runtimeOnly("maven.modrinth:the-undergarden:${undergarden_version}-neoforge")
    runtimeOnly("maven.modrinth:raised:${raised_version}-neoforge")

    implementation("maven.modrinth:appleskin:${appleskin_version}-neoforge")
    runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${clothconfig_version}")

    runtimeOnly("maven.modrinth:forge-config-api-port:${forgeconfig_version}-neoforge")
    implementation("maven.modrinth:overflowing-bars:${overflowingbars_version}-neoforge")
    implementation("maven.modrinth:puzzles-lib:${puzzleslib_version}-neoforge")
}

processResources {
    var expandProps = [
            mod_version               : project.version,
            min_minecraft_version     : rootProject.min_minecraft_version,
            min_neoforge_version      : rootProject.neoforge_version,
            min_colorfulhearts_version: project(":base").version
    ]

    inputs.properties expandProps
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    from rootProject.file("LICENSE")
    from(project(":base:neoforge").loom.accessWidenerPath) {
        rename { "colorfulhearts_extensions.accesswidener" }
    }
}
