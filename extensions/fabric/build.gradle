plugins {
    id 'com.gradleup.shadow'
}

import com.google.gson.JsonObject
import net.fabricmc.loom.api.LoomGradleExtensionAPI
import net.fabricmc.loom.util.ZipUtils

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        server.setGenerateRunConfig(false)
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    loom.nestJars(tasks.named("shadowJar", Jar.class), configurations.named("include"))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }

    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

repositories {
    maven {
        name = "TerraformersMC Maven"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jitpack"
        url 'https://jitpack.io/'
    }
    maven {
        name = "Greenhouse Maven"
        url = 'https://maven.greenhouse.lgbt/releases/'
    }
}

dependencies {
    // Fabric
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    common(project(path: ':extensions:common')) { transitive false }
    shadowCommon(project(path: ':extensions:common', configuration: 'transformProductionFabric'))

    api(project(path: ':api:common')) { transitive false }
    api(project(path: ':api:fabric')) { transitive false }
    runtimeOnly(project(path: ':base:common')) { transitive false }
    runtimeOnly(project(path: ':base:fabric')) { transitive false }
    runtimeOnly("com.electronwill.night-config:core:${nightconfig_version}")
    runtimeOnly("com.electronwill.night-config:toml:${nightconfig_version}")

    runtimeOnly("maven.modrinth:modmenu:${modmenu_version}-fabric")
    runtimeOnly("maven.modrinth:raised:${raised_version}-fabric")

    implementation("maven.modrinth:appleskin:${appleskin_version}-fabric")
//    runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${clothconfig_version}")

    runtimeOnly("maven.modrinth:forge-config-api-port:${forgeconfig_version}-fabric")
    implementation("maven.modrinth:overflowing-bars:${overflowingbars_version}-fabric")
    implementation("maven.modrinth:puzzles-lib:${puzzleslib_version}-fabric")

    implementation("vectorwing:FarmersDelight:${farmersdelight_version}+refabricated") {
        exclude(group: "net.fabricmc")
    }
}

processResources {
    var expandProps = [
            mod_version               : project.version,
            min_minecraft_version     : rootProject.min_minecraft_version,
            min_fabric_loader_version : rootProject.fabric_loader_version,
            min_fabric_api_version    : rootProject.fabric_api_version,
            min_colorfulhearts_version: project(":base").version
    ]

    inputs.properties expandProps
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
    from(project(":base:fabric").getExtensions().getByType(LoomGradleExtensionAPI.class).accessWidenerPath) {
        rename { "colorfulhearts_extensions.accesswidener" }
    }
    doLast {
        var archivePath = archiveFile.get().getAsFile().toPath()
        ZipUtils.transformJson(JsonObject.class, archivePath, "fabric.mod.json", json -> {
            json.addProperty("accessWidener", "colorfulhearts_extensions.accesswidener")
            return json
        })
    }
}
