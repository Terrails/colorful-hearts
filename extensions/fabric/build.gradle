plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        server.ideConfigGenerated(false)
        // set window size to 720p
        client.programArgs("--width", "1280", "--height", "720")
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "TerraformersMC Maven"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jitpack"
        url 'https://jitpack.io/'
    }
}

dependencies {
    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    common(project(path: ':extensions:common', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':extensions:common', configuration: 'transformProductionFabric'))

    api(project(path: ':api:common', configuration: 'namedElements')) { transitive false }
    api(project(path: ':api:fabric', configuration: 'namedElements')) { transitive false }
    runtimeOnly(project(path: ':base:common', configuration: 'namedElements')) { transitive false }
    runtimeOnly(project(path: ':base:fabric', configuration: 'namedElements')) { transitive false }

    modRuntimeOnly("maven.modrinth:modmenu:${modmenu_version}-fabric")
    modRuntimeOnly("maven.modrinth:raised:${raised_version}-fabric")

    modImplementation("maven.modrinth:appleskin:${appleskin_version}-fabric")
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${clothconfig_version}")

    modRuntimeOnly("maven.modrinth:forge-config-api-port:${forgeconfig_version}-fabric")
    modImplementation("maven.modrinth:overflowing-bars:${overflowingbars_version}-fabric")
    modImplementation("maven.modrinth:puzzles-lib:${puzzleslib_version}-fabric")

    modCompileOnly("maven.modrinth:farmers-delight-refabricated:${farmersdelight_version}-fabric")
    modCompileOnly("com.github.Chocohead:Fabric-ASM:${fabricasm_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

remapJar {
    input.set shadowJar.archiveFile
    injectAccessWidener = true
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

sourcesJar {
    afterEvaluate {
        [":extensions:common"].forEach {
            def sourcesTask = project(it).sourcesJar
            dependsOn sourcesTask
            from sourcesTask.archiveFile.map { zipTree(it) }
        }
    }
}

tasks.build.mustRunAfter(tasks.clean)
tasks.register('publishProduction') {
    dependsOn([tasks.clean, tasks.build])
    finalizedBy([tasks.modrinth, tasks.publishCurseForge])
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${project.modrinth_id}"
    versionNumber = "${project.version}"
    versionName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    uploadFile = tasks.remapJar.getArchiveFile().get()
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "colorful-hearts"
    }
    changelog = parent.file("CHANGELOG.md").text
    additionalFiles = [tasks.sourcesJar.getArchiveFile().get()]
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    disableVersionDetection()

    def mainFile = upload(project.curseforge_id, tasks.remapJar.getArchiveFile().get())
    mainFile.displayName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    mainFile.releaseType = "release"
    mainFile.changelog = parent.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion("Client", project.minecraft_version)
    mainFile.addRequirement("fabric-api", "colorful-hearts")
    mainFile.addModLoader("fabric")
    mainFile.withAdditionalFile(tasks.sourcesJar.getArchiveFile().get())
}
