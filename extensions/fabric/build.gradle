plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        server.ideConfigGenerated(false)
        // set window size to 720p
        client.programArgs("--width", "1280", "--height", "720")
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    shadowArtifact {
        canBeConsumed = true
        canBeResolved = false
    }
}

repositories {
    maven {
        name = "TerraformersMC Maven"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jitpack"
        url 'https://jitpack.io/'
    }
}

dependencies {
    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    common(project(path: ':extensions:common', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':extensions:common', configuration: 'transformProductionFabric'))

    api(project(path: ':api:common', configuration: 'namedElements')) { transitive false }
    api(project(path: ':api:fabric', configuration: 'namedElements')) { transitive false }
    runtimeOnly(project(path: ':base:common', configuration: 'namedElements')) { transitive false }
    runtimeOnly(project(path: ':base:fabric', configuration: 'namedElements')) { transitive false }
    runtimeOnly("com.electronwill.night-config:core:${nightconfig_version}")
    runtimeOnly("com.electronwill.night-config:toml:${nightconfig_version}")

    modRuntimeOnly("maven.modrinth:modmenu:${modmenu_version}-fabric")
    modRuntimeOnly("maven.modrinth:raised:${raised_version}-fabric")

    modImplementation("maven.modrinth:appleskin:${appleskin_version}-fabric")
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${clothconfig_version}")

    modRuntimeOnly("maven.modrinth:forge-config-api-port:${forgeconfig_version}-fabric")
    modImplementation("maven.modrinth:overflowing-bars:${overflowingbars_version}-fabric")
    modImplementation("maven.modrinth:puzzles-lib:${puzzleslib_version}-fabric")

    modCompileOnly("maven.modrinth:farmers-delight-refabricated:${farmersdelight_version}-fabric")
    modCompileOnly("com.github.Chocohead:Fabric-ASM:${fabricasm_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

remapJar {
    input.set shadowJar.archiveFile
    injectAccessWidener = true
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

artifacts {
    shadowArtifact(shadowJar)
}
