allprojects {
    group = "terrails.colorfulhearts.api" // required to prevent circular dependency
    version = project.mod_api_version
}

subprojects {
    loom {
        accessWidenerPath = project(":common").file("src/main/resources/colorfulhearts.accesswidener")
    }

    base {
        // colorfulhearts-loader-version
        archivesBaseName = "colorfulhearts-${project.name}-api"
    }
}
