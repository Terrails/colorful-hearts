plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

import net.darkhax.curseforgegradle.TaskPublishCurseForge
import net.fabricmc.loom.task.RemapJarTask

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        server.setGenerateRunConfig(false)
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    neoForge {
        convertAccessWideners(tasks.named('remapJar', RemapJarTask.class), 'colorfulhearts.accesswidener')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    common(project(path: ':api:common', configuration: 'namedElements')) { transitive false }
    common(project(path: ':api:neoforge', configuration: 'namedElements')) { transitive false }
    common(project(path: ':base:common', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':api:common', configuration: 'transformProductionNeoForge'))
    shadowBundle(project(path: ':api:neoforge', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':base:common', configuration: 'transformProductionNeoForge'))
    include(project(path: ':extensions:neoforge', configuration: 'remapArtifact')) { transitive false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

remapJar {
    input.set shadowJar.archiveFile
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

tasks.register('publishProduction') {
    dependsOn([tasks.build])
    finalizedBy([tasks.modrinth, tasks.publishCurseForge])
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${project.modrinth_id}"
    versionNumber = "${project.version}"
    versionName = "[NeoForge] ${project.minecraft_version}-v${project.version}"
    uploadFile = tasks.remapJar.getArchiveFile().get()
    gameVersions = [project.minecraft_version]
    loaders = ["neoforge"]
    changelog = rootProject.file("CHANGELOG.md").text
}


tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    disableVersionDetection()

    def mainFile = upload(project.curseforge_id, tasks.remapJar.getArchiveFile().get())
    mainFile.displayName = "[NeoForge] ${project.minecraft_version}-v${project.version}"
    mainFile.releaseType = "release"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion("Client", project.minecraft_version)
    mainFile.addModLoader("neoforge")
}
