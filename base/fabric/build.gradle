plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

import com.google.gson.JsonObject
import net.darkhax.curseforgegradle.TaskPublishCurseForge
import net.fabricmc.loom.util.ZipUtils

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        server.setGenerateRunConfig(false)
        // set window size to 720p
        client.setProgramArguments(["--width", "1280", "--height", "720"])
    }

    loom.nestJars(tasks.named("shadowJar", Jar.class), configurations.named("include"))
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }

    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

dependencies {
    // Fabric
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    common(project(path: ':base:common')) { transitive false }
    common(project(path: ':api:common')) { transitive false }
    common(project(path: ':api:fabric')) { transitive false }
    shadowCommon(project(path: ':base:common', configuration: 'transformProductionFabric'))
    shadowCommon(project(path: ':api:common', configuration: 'transformProductionFabric'))
    shadowCommon(project(path: ':api:fabric')) { transitive false }
    include(project(path: ':extensions:fabric')) { transitive false }

    api(include("com.electronwill.night-config:core:${nightconfig_version}"))
    api(include("com.electronwill.night-config:toml:${nightconfig_version}"))

    implementation("maven.modrinth:modmenu:${modmenu_version}-fabric")
}

processResources {
    var expandProps = [
            mod_version              : project.version,
            min_minecraft_version    : rootProject.min_minecraft_version,
            min_fabric_loader_version: rootProject.fabric_loader_version,
            min_fabric_api_version   : rootProject.fabric_api_version
    ]

    inputs.properties expandProps
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
    doLast {
        var archivePath = archiveFile.get().getAsFile().toPath()
        ZipUtils.transformJson(JsonObject.class, archivePath, "fabric.mod.json", json -> {
            json.addProperty("accessWidener", "colorfulhearts.accesswidener")
            return json
        })
    }
}

tasks.build.mustRunAfter(tasks.clean)
tasks.register('publishProduction') {
    dependsOn([tasks.clean, tasks.build])
    finalizedBy([tasks.modrinth, tasks.publishCurseForge])
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "${project.modrinth_id}"
    versionNumber = "${project.version}"
    versionName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    uploadFile = tasks.shadowJar.getArchiveFile().get()
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
    }
    changelog = rootProject.file("CHANGELOG.md").text
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    disableVersionDetection()

    def mainFile = upload(project.curseforge_id, tasks.shadowJar.getArchiveFile().get())
    mainFile.displayName = "[Fabric] ${project.minecraft_version}-v${project.version}"
    mainFile.releaseType = "release"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.changelogType = "markdown"
    mainFile.addGameVersion("Client", project.minecraft_version)
    mainFile.addRequirement("fabric-api")
    mainFile.addModLoader("fabric")
}
