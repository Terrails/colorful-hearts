name: Publish API to Github Packages

on:
  workflow_dispatch:

jobs:
  publish-api:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew :api:common:build :api:fabric:build :api:neoforge:build

      - name: Publish to Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :api:common:publish :api:fabric:publish :api:neoforge:publish
