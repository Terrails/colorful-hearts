name: Publish

on:
  workflow_dispatch:

jobs:
  publish-production:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read mod version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' base/gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_NAME" >/dev/null 2>&1; then
            echo "Release $RELEASE_NAME already exists."
            exit 1
          fi

      #      - name: Run publishProduction
      #        env:
      #          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      #          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      #        run: ./gradlew :base:fabric:publishProduction :base:neoforge:publishProduction

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_NAME" \
            --title "Colorful Hearts $RELEASE_NAME" \
            base/fabric/build/libs/*[0-9].jar \
            base/neoforge/build/libs/*[0-9].jar \
            api/fabric/build/libs/*[0-9].jar \
            api/neoforge/build/libs/*[0-9].jar
