name: Compile

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload API artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-artifacts
          path: |
            api/*/build/libs/*[0-9].jar
            api/*/build/libs/*[0-9]-sources.jar

      - name: Upload Base artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            base/*/build/libs/*[0-9].jar

      - name: Upload Extensions artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extensions-artifacts
          path: |
            extensions/*/build/libs/*[0-9].jar
